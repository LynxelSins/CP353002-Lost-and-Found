name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
        with:
          directory: code

      - name: Build Application with Maven
        working-directory: code
        run: mvn clean package -DskipTests -B

      - name: Upload Build Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: lost-and-found-app
          path: code/target/CP353002_Group12_LostAndFound-*.jar
          retention-days: 7

  test:
    name: Run Tests (JUnit 5 + Mockito)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        working-directory: code
        run: mvn test -B
        # ถ้า test ยังไม่ครบ ให้ใส่ continue-on-error: true ชั่วคราว
        continue-on-error: true

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: code/target/surefire-reports/
          retention-days: 7

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: code/target/surefire-reports/TEST-*.xml
          comment_mode: always
          check_name: JUnit Test Results
