# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=CP353002_Group12_LostAndFound

# ===================================================================
# Server
# ===================================================================
server.port=8080

# ===================================================================
# PostgreSQL DataSource (Neon Cloud)
# ===================================================================
# แนะนำให้ดึงค่าจาก Environment Variable (หากไม่ตั้งค่า จะใช้ค่า Default หลัง :-)
spring.datasource.url=jdbc:postgresql://ep-dawn-surf-b348agkp-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Springdoc OpenAPI / Swagger
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method