# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=CP353002_Group12_LostAndFound

# ===================================================================
# Server
# ===================================================================
server.port=8080

# ===================================================================
# PostgreSQL DataSource (Neon Cloud)
# ===================================================================
# แนะนำให้ดึงค่าจาก Environment Variable (หากไม่ตั้งค่า จะใช้ค่า Default หลัง :)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-dawn-surf-b348agkp-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate
# ===================================================================
# schema.sql คือ Source of Truth เพียงตัวเดียว -> Hibernate แค่ "ตรวจสอบ" ไม่สร้าง/แก้ตารางเอง
# (ต้องมีตารางอยู่ก่อนแล้วจาก schema.sql ไม่งั้น validate จะ fail ตอน startup)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# SQL Init (schema.sql / data.sql)
# ===================================================================
# รัน schema.sql + data.sql ทุกครั้งตอน startup, "always" ใช้กับ Postgres ที่ไม่ใช่ embedded DB ด้วย
spring.sql.init.mode=always
# ต้องเป็น false (ค่า default) เพื่อให้ schema.sql/data.sql รันก่อนที่ Hibernate จะ validate schema
spring.jpa.defer-datasource-initialization=false

# ===================================================================
# Springdoc OpenAPI / Swagger
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
