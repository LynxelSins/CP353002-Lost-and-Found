# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=CP353002_Group12_LostAndFound

# ===================================================================
# Active Profile
# ===================================================================
# ตอนนี้ยังลองรันแบบ local ก่อน -> ใช้ profile "dev" (Postgres local ผ่าน pgAdmin4) เป็นค่าเริ่มต้น
# พอพร้อมใช้ Neon จริงแล้ว เปลี่ยนบรรทัดนี้เป็น: spring.profiles.active=neon
# (config เชื่อม Neon เก็บไว้แล้วที่ application-neon.yml ไม่ต้องตั้งใหม่)
spring.profiles.active=dev

# ===================================================================
# Server
# ===================================================================
server.port=8080

# ===================================================================
# PostgreSQL DataSource
# ===================================================================
# ค่าเชื่อมต่อฐานข้อมูลจริงอยู่ใน application-dev.yml (local) และ application-neon.yml (cloud)
# แยกตาม profile ที่เลือกใช้ด้านบน

# ===================================================================
# JPA / Hibernate
# ===================================================================
# schema.sql คือ Source of Truth เพียงตัวเดียว -> Hibernate แค่ "ตรวจสอบ" ไม่สร้าง/แก้ตารางเอง
# (ต้องมีตารางอยู่ก่อนแล้วจาก schema.sql ไม่งั้น validate จะ fail ตอน startup)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# SQL Init (schema.sql / data.sql)
# ===================================================================
# รัน schema.sql + data.sql ทุกครั้งตอน startup, "always" ใช้กับ Postgres ที่ไม่ใช่ embedded DB ด้วย
spring.sql.init.mode=always
# ต้องเป็น false (ค่า default) เพื่อให้ schema.sql/data.sql รันก่อนที่ Hibernate จะ validate schema
spring.jpa.defer-datasource-initialization=false

# ===================================================================
# Springdoc OpenAPI / Swagger
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# Firebase Admin SDK (verify Google Sign-In ID tokens)
# ===================================================================
# ดาวน์โหลด Service Account Key จาก Firebase Console -> Project Settings -> Service accounts
# -> Generate new private key แล้ววางไฟล์ .json ไว้ที่ src/main/resources/
# ห้าม commit ไฟล์นี้ขึ้น git! ให้เพิ่มชื่อไฟล์ลงใน .gitignore ด้วย
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}

# ===================================================================
# JWT
# ===================================================================
jwt.secret=${JWT_SECRET:CHANGE-THIS-DEV-ONLY-SECRET-KEY-MIN-32-CHARS!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}