services:
  postgres:
    image: postgres:16
    container_name: lostfound-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: your_local_user
      POSTGRES_PASSWORD: your_local_password
      POSTGRES_DB: lost_and_found
    ports:
      - "5432:5432"
    volumes:
      - lostfound_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your_local_user -d lost_and_found"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lostfound_pg_data:
