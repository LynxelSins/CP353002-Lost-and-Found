services:
  postgres:
    image: postgres:16
    container_name: lostfound-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lost_and_found
    ports:
      - "5432:5432"
    volumes:
      - lostfound_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lost_and_found"]
      interval: 5s
      timeout: 5s
      retries: 10

pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lostfound-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lostfound.local
      PGADMIN_DEFAULT_PASSWORD: admin
      ports:
        - "5050:80"
      depends_on:
        postgres:
          condition: service_healthy

volumes:
  lostfound_pg_data:
