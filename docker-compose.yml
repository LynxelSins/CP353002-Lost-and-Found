services:
  # ===================================================================
  # Backend Spring Boot Service
  # ===================================================================
  backend:
    build:
      context: ./code
      dockerfile: Dockerfile
    container_name: lostfound-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ใช้โปรไฟล์ dev เพื่อต่อเข้า PostgreSQL ใน Docker network เดียวกัน
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      # ชี้ datasource ไปยังชื่อ service 'postgres' แทน localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lost_and_found
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy

  # ===================================================================
  # Local PostgreSQL Database
  # ===================================================================
  postgres:
    image: postgres:16
    container_name: lostfound-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lost_and_found
    ports:
      - "5432:5432"
    volumes:
      - lostfound_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lost_and_found"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===================================================================
  # pgAdmin Database Management Tool
  # ===================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lostfound-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lostfound_pg_data:
