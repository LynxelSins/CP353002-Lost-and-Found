services:
  # ===================================================================
  # Frontend React (Vite + Nginx)
  # ===================================================================
  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
    container_name: lostfound-frontend
    restart: unless-stopped
    ports:
      - "5173:80" # เอาพอร์ต 5173 บนเครื่อง ชี้เข้าไปที่พอร์ต 80 ของ Nginx ใน Container
    depends_on:
      - backend

  # ===================================================================
  # Backend Spring Boot Service
  # ===================================================================
  backend:
    build:
      context: ./code
      dockerfile: Dockerfile
    container_name: lostfound-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: neon
      PORT: 8080
      #SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lost_and_found
      #SPRING_DATASOURCE_USERNAME: postgres
      #SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy

  # ===================================================================
  # Local PostgreSQL Database
  # ===================================================================
  postgres:
    image: postgres:16
    container_name: lostfound-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lost_and_found
    ports:
      - "5432:5432"
    volumes:
      - lostfound_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lost_and_found"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===================================================================
  # pgAdmin Database Management Tool
  # ===================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lostfound-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lostfound_pg_data:
